<!-- PRELOADER -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const preloader = document.getElementById("preloader");

    if (preloader) {

        preloader.style.opacity = "0";

        setTimeout(() => {
            preloader.remove();
        }, 300);

    }

});

</script>


<!-- VISTA PREVIA ARCHIVOS -->

<script>

function vistaPreviaArchivo(id, titulo, extension) {

    const url = 'descargar.php?id=' + id;
    const visor = document.getElementById("archivoPreview");

    document.getElementById("archivoTitulo")
            .innerText = titulo;

    document.getElementById("btnDescargar")
            .href = url;

    visor.innerHTML = "";

    const ext = extension.toLowerCase();

    if (ext === ".pdf") {

        visor.innerHTML =
            `<iframe src="${url}"></iframe>`;

    } else if ([".jpg",".jpeg",".png"].includes(ext)) {

        visor.innerHTML =
            `<img src="${url}">`;

    } else {

        visor.innerHTML =
            `<p>No se puede previsualizar este archivo.</p>`;

    }

    document.getElementById("btnImprimir")
        .onclick = () => {

            const w = window.open(url);
            w.print();

        };

    const modal =
        new bootstrap.Modal(
            document.getElementById("archivoModal")
        );

    modal.show();

}

</script>
