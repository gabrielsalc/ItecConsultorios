  <!-- Script de vista previa -->
  <script>
    function vistaPreviaArchivo(id, titulo, extension) {
      var extens = extension.toLowerCase();
      var url = 'descargar.php?id=' + id;

      $('#archivoTitulo').text(titulo);
      $('#btnDescargar').attr('href', url).attr('download', titulo + extension);
      var visor = $('#archivoPreview');
      visor.empty();

      if (extens === '.pdf') {
        visor.html('<iframe src="' + url + '" width="100%" height="100%" frameborder="0"></iframe>');
        $('#btnImprimir').show();
      } else if (extens === '.jpg' || extens === '.jpeg' || extens === '.png') {
        visor.html('<img src="' + url + '" alt="imagen" class="img-responsive center-block">');
        $('#btnImprimir').show();
      } else {
        visor.html('<p>No se puede previsualizar este tipo de archivo. Solo se puede descargar.</p>');
        $('#btnImprimir').hide();
      }

      $('#btnImprimir').off('click').on('click', function () {
        var w = window.open(url, '_blank');
        w.focus();
        w.print();
      });

      $('#archivoModal').modal('show');
    }
  </script>
